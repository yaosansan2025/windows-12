name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only the self-contained webpage, never repository metadata.
      - name: Prepare website
        run: |
          mkdir -p "$RUNNER_TEMP/windows-12-site"
          cp index.html "$RUNNER_TEMP/windows-12-site/index.html"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/windows-12-site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
