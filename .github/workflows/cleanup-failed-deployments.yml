name: Clean up failed Pages deployments

on:
  push:
    paths:
      - .github/workflows/cleanup-failed-deployments.yml

permissions:
  actions: write
  deployments: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove failed Pages deployments and runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }
          failed_run_ids = {
              39496103521, 39495920036, 38797011156, 38796870366,
              38796359510, 38628088102, 38626531656, 38622637761,
              38621670477, 38522695199, 38521213540,
          }
          errors = []

          def api(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              if data is not None:
                  request.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          # GitHub creates deployment records for jobs with an environment.
          # Remove only failed github-pages records from the original failed runs.
          try:
              for deployment in api("GET", "/deployments?environment=github-pages&per_page=100"):
                  if deployment["created_at"] > "2026-10-21T01:45:39Z":
                      continue
                  deployment_id = deployment["id"]
                  statuses = api("GET", f"/deployments/{deployment_id}/statuses?per_page=1")
                  if not statuses or statuses[0]["state"] not in ("failure", "error"):
                      continue
                  try:
                      api("POST", f"/deployments/{deployment_id}/statuses", {"state": "inactive"})
                      api("DELETE", f"/deployments/{deployment_id}")
                      print(f"Deleted failed Pages deployment {deployment_id}")
                  except urllib.error.HTTPError as exc:
                      errors.append(f"deployment {deployment_id}: HTTP {exc.code}")
          except urllib.error.HTTPError as exc:
              errors.append(f"list deployments: HTTP {exc.code}")

          for run_id in sorted(failed_run_ids):
              try:
                  run = api("GET", f"/actions/runs/{run_id}")
                  if run["conclusion"] != "failure" or run["path"] != ".github/workflows/deploy.yml":
                      errors.append(f"run {run_id}: unexpected state or workflow; skipped")
                      continue
                  api("DELETE", f"/actions/runs/{run_id}")
                  print(f"Deleted failed Pages workflow run {run_id}")
              except urllib.error.HTTPError as exc:
                  errors.append(f"run {run_id}: HTTP {exc.code}")

          if errors:
              print("Cleanup issues:")
              for error in errors:
                  print(error)
              raise SystemExit(1)
          print("Failed Pages deployment cleanup complete.")
          PY
