name: Read encrypted Cloudflare diagnostics

on:
  push:
    branches: [feat/desktop-usability]
    paths: [.github/workflows/cloudflare-diagnostics.yml]

permissions:
  contents: read

jobs:
  read-logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect diagnostics without printing build logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request

          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          if not token:
              raise SystemExit('CLOUDFLARE_API_TOKEN repository secret is not available.')
          base = 'https://api.cloudflare.com/client/v4'
          account = '/accounts/f923125a5651ccdaae1a29bb285412f9'
          responses = {}

          def get(path):
              request = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return {'status': response.status, 'body': json.loads(response.read())}
              except urllib.error.HTTPError as error:
                  return {'status': error.code, 'body': json.loads(error.read())}

          for uuid in ['e826da7a-87ca-4837-b3ba-94adfdaccc77', '60ddcaf1-997f-43ee-a8b0-e8aee84a30f8']:
              responses['logs:' + uuid] = get(account + '/builds/builds/' + uuid + '/logs')
              print('Build log request HTTP status:', responses['logs:' + uuid]['status'])
          workers = get(account + '/workers/scripts')
          if workers['status'] == 200:
              worker = next((item for item in workers['body'].get('result', []) if item.get('id') == 'windows-12'), None)
              if worker:
                  responses['worker'] = {key: worker.get(key) for key in ['id', 'tag', 'modified_on']}
                  triggers = get(account + '/builds/workers/' + worker['tag'] + '/triggers')
                  if triggers['status'] == 200:
                      allowed = ['trigger_uuid', 'uuid', 'build_command', 'deploy_command', 'non_production_deploy_command', 'root_directory', 'branch_includes', 'branch_excludes', 'external_script_id']
                      results = triggers['body'].get('result', [])
                      if isinstance(results, list):
                          responses['triggers'] = [{key: item[key] for key in allowed if key in item} for item in results]
                  else:
                      responses['triggers_status'] = triggers['status']
          else:
              responses['workers_status'] = workers['status']
          target = Path(os.environ['RUNNER_TEMP'])
          (target / 'cloudflare-diagnostics.json').write_text(json.dumps(responses))
          (target / 'recipient.crt').write_text('''-----BEGIN CERTIFICATE-----\nMIIDITCCAgmgAwIBAgIUA9m/qzKnvIt+PyngX1ZBUUzCqyAwDQYJKoZIhvcNAQEL\nBQAwIDEeMBwGA1UEAwwVd2luZG93czEyLWRpYWdub3N0aWNzMB4XDTI2MTAyOTAz\nMTIzMloXDTI2MTAzMTAzMTIzMlowIDEeMBwGA1UEAwwVd2luZG93czEyLWRpYWdu\nb3N0aWNzMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtfetjnn777BH\n/5Kvw9dStUk9YYoTDeRpFqEuSRkR/MHyTc53dUlkFo/IaKCD8fdW202ovzssxDuy\ncHGOH7KeDGFpZ3L7u0srjTsuRQHSnRI8O+R3UGGZFFMEsrfOrAkE/k2L4WzcgxzH\nrjqdjMFquuC2KOX6r5FC49jM/a7dJaq/Ci+gP9h0DFQpHjCI/bDuCgCPvIaUQCCh\nfIRWOguJ7U6nyb3C8jCKHZYt3ZU5d60xvxMVTyG5rjXEBDpBjLkPyMWyDxJG1/gl\nkCUsihK4HbXOf4JsPvflzLyU33Ds7XMG6Cn+1+79gQkck04POr5f0WETkP1YjZe1\n1C9NqVyqjQIDAQABo1MwUTAdBgNVHQ4EFgQUfLmKP79mvXkMlG9r34ZL8IWlpD8w\nHwYDVR0jBBgwFoAUfLmKP79mvXkMlG9r34ZL8IWlpD8wDwYDVR0TAQH/BAUwAwEB\n/zANBgkqhkiG9w0BAQsFAAOCAQEAqKo0mKY4J6G9oQ4C36Oq5fJ3APmEyIj7ejdM\nnlCKoxndYJfB9ZQMi+Rsnkzg2K6GShHj7Bje0z143n/xnzvCyJT+HWcA0qoCNzRt\nNsZF/iepluZlcNlwqXDiQArcBQn4Y5VY9AnCOmCfX4s4QmUy4ZMYmQNxnWjg4l06\nQeoOGWmkSamNd6AOLuNeY7ccrSTeJhHpkVI1DekToTohS+u6SJ6xFcFgjLbeea+m\nxOdblUi9+Z7v2jIspRLB5F+JuiBoFoFXYa/B16M5fI4U8z4pdRZEcbbT8uSsghCw\nQU2IxegRgCDKLIW1zBHTK7K1cIQ3bVVEzUKGDsBeJjiL4ddlmA==\n-----END CERTIFICATE-----''')
          PY
          openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/cloudflare-diagnostics.json" -outform DER -out "$RUNNER_TEMP/cloudflare-diagnostics.enc" "$RUNNER_TEMP/recipient.crt"
          rm "$RUNNER_TEMP/cloudflare-diagnostics.json"

      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-cloudflare-diagnostics
          path: ${{ runner.temp }}/cloudflare-diagnostics.enc
          retention-days: 1
